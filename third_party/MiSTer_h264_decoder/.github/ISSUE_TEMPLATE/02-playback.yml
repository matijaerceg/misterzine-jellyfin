name: Picture or sound during playback
description: Stutter, artefacts, wrong colours, audio and video out of step, geometry
labels: ["bug", "area:playback"]
body:
  - type: input
    id: version
    attributes:
      label: Core version
      placeholder: H264 v0.1.0 261001
    validations:
      required: true
  - type: input
    id: program
    attributes:
      label: Which program was sending the stream, and its version?
      placeholder: e.g. a Moonlight client, a Jellyfin client, the reference file player
    validations:
      required: true
  - type: textarea
    id: stream
    attributes:
      label: What was the stream?
      description: Resolution, frame rate, bitrate and the audio codec if you know them; the source (a game, a film, a TV recording).
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem?
      options:
        - Stutter or judder
        - Audio and video out of step
        - Artefacts, blockiness, or corruption
        - Wrong colours
        - Picture geometry — stretched, squashed, cropped
        - The core refused the stream
        - Something else
    validations:
      required: true
  - type: dropdown
    id: output
    attributes:
      label: Which output are you watching?
      options:
        - HDMI
        - Analog — CRT
        - Analog — other display
        - Both
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Describe it
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Photo or video
      description: For audio sync, a phone video with sound is worth far more than a description.
